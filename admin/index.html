<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>注文管理｜峯商店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#6fbac8; --teal-deep:#1f4e5a; --terra:#c2703d; --terra-deep:#a85a2c;
  --ink:#2b2723; --muted:#6b655c; --paper:#faf6ee; --paper-2:#fffdf8; --paper-deep:#f1eadd;
  --line:rgba(43,39,35,.10); --ok:#3f8f6f; --warn:#b23b3b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:var(--paper);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
.ji{font-family:'Shippori Mincho',serif}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--teal);color:#fff}

/* ---------- ログイン画面 ---------- */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 15%,#28596650,transparent 55%),linear-gradient(155deg,var(--teal-deep),#132f36 78%);
  padding:24px}
.login-card{width:100%;max-width:360px;background:var(--paper-2);border-radius:20px;padding:38px 32px 32px;
  box-shadow:0 30px 70px rgba(0,0,0,.35);text-align:center;animation:riseIn .5s ease both}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.login-mark{font-family:'Shippori Mincho',serif;font-size:26px;font-weight:700;color:var(--teal-deep);letter-spacing:.04em}
.login-sub{font-size:11px;letter-spacing:.22em;color:var(--terra);margin-top:6px;font-weight:700}
.login-title{margin-top:22px;font-size:14px;color:var(--muted)}
.login-form{margin-top:22px;text-align:left}
.login-form label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.login-form input{width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--paper);font-family:inherit;font-size:15px;color:var(--ink);transition:border-color .2s,background .2s}
.login-form input:focus{outline:none;border-color:var(--teal);background:#fff}
.login-btn{margin-top:16px;width:100%;padding:13px;border:0;border-radius:11px;background:var(--terra);color:#fff;
  font-weight:700;font-size:14.5px;box-shadow:0 10px 24px rgba(194,112,61,.30);transition:transform .15s,filter .15s}
.login-btn:hover{filter:brightness(1.06)}
.login-btn:active{transform:translateY(1px)}
.login-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.login-err{margin-top:14px;font-size:12.5px;color:var(--warn);min-height:14px;line-height:1.6}

/* ---------- ダッシュボード共通 ---------- */
#dashboardView{display:none}
.adm-header{position:sticky;top:0;z-index:30;background:var(--teal-deep);color:#fff;padding:14px 0}
.adm-wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.adm-header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px}
.adm-brand{display:flex;align-items:center;gap:10px}
.adm-brand .mark{font-family:'Shippori Mincho',serif;font-weight:700;font-size:18px;letter-spacing:.03em}
.adm-brand .tag{font-size:10px;letter-spacing:.18em;color:var(--teal);text-transform:uppercase}
.logout-btn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.24);color:#fff;
  padding:8px 16px;border-radius:9px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .2s}
.logout-btn:hover{background:rgba(255,255,255,.18)}

.adm-main{max-width:1180px;margin:0 auto;padding:26px 20px 70px}

/* ---------- 統計カード ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat-card{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 20px rgba(28,30,30,.05)}
.stat-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--teal-deep);background:var(--paper-deep)}
.stat-label{font-size:11.5px;color:var(--muted);font-weight:600}
.stat-value{font-size:21px;font-weight:700;color:var(--ink);font-family:'Shippori Mincho',serif}
.stat-value small{font-size:12px;font-weight:500;color:var(--muted);font-family:'Noto Sans JP',sans-serif}

/* ---------- フィルターバー ---------- */
.filter-bar{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:18px}
.f-field{display:flex;flex-direction:column;gap:5px}
.f-field label{font-size:11px;color:var(--muted);font-weight:600}
.f-field input,.f-field select{padding:9px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--paper);font-family:inherit;font-size:13px;color:var(--ink)}
.f-field input:focus,.f-field select:focus{outline:none;border-color:var(--teal)}
.f-q{flex:1;min-width:200px}
.f-btn{padding:10px 20px;border:0;border-radius:9px;background:var(--teal-deep);color:#fff;font-weight:700;font-size:13px;transition:filter .15s}
.f-btn:hover{filter:brightness(1.12)}
.f-reset{padding:10px 6px;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.f-reset:hover{color:var(--ink)}

/* ---------- テーブル ---------- */
.orders-panel{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 20px rgba(28,30,30,.05)}
table.orders-table{width:100%;border-collapse:collapse;font-size:13.5px}
.orders-table thead th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.03em;
  padding:13px 16px;background:var(--paper-deep);white-space:nowrap}
.orders-table tbody tr{border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.orders-table tbody tr:hover{background:var(--paper-deep)}
.orders-table td{padding:13px 16px;vertical-align:middle;white-space:nowrap}
.td-name{font-weight:600}
.td-amount{font-weight:700;font-family:'Shippori Mincho',serif}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.captured{background:#e4f2ec;color:var(--ok)}
.badge.authorized{background:#fbeee2;color:var(--terra-deep)}
.badge.other{background:var(--paper-deep);color:var(--muted)}
.table-empty,.table-loading{padding:60px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.table-scroll{overflow-x:auto}

.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line)}
.pg-info{font-size:12.5px;color:var(--muted)}
.pg-btns{display:flex;gap:8px}
.pg-btns button{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:12.5px;color:var(--ink);transition:background .15s}
.pg-btns button:hover:not(:disabled){background:var(--paper-deep)}
.pg-btns button:disabled{opacity:.4;cursor:not-allowed}

/* ---------- 詳細モーダル ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(20,24,24,.55);display:none;align-items:center;justify-content:center;
  padding:20px;z-index:100;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex;animation:fadeIn .18s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--paper-2);border-radius:20px;
  box-shadow:0 40px 90px rgba(0,0,0,.35);animation:popIn .22s cubic-bezier(.2,.8,.3,1.1) both}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-head{position:sticky;top:0;background:var(--teal-deep);color:#fff;padding:18px 22px;display:flex;
  align-items:center;justify-content:space-between;border-radius:20px 20px 0 0}
.modal-head-title{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:700}
.modal-close{background:rgba(255,255,255,.14);border:0;color:#fff;width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.modal-close:hover{background:rgba(255,255,255,.24)}
.modal-body{padding:22px}
.mb-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.mb-id{font-size:11px;color:var(--muted);font-family:monospace}
.mb-section{margin-bottom:20px}
.mb-section h4{font-size:11.5px;color:var(--terra-deep);letter-spacing:.06em;font-weight:700;margin-bottom:10px;
  display:flex;align-items:center;gap:6px}
.cust-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px}
.cust-grid dt{color:var(--muted);font-size:12px}
.cust-grid dd{font-weight:500}
.copy-btn{margin-top:12px;width:100%;padding:10px;border-radius:9px;border:1px dashed var(--line);
  background:var(--paper);color:var(--teal-deep);font-weight:700;font-size:12.5px;display:flex;align-items:center;
  justify-content:center;gap:6px;transition:background .15s,border-color .15s}
.copy-btn:hover{background:var(--paper-deep);border-color:var(--teal)}
.copy-btn.copied{background:#e4f2ec;border-color:var(--ok);color:var(--ok)}
table.items-table{width:100%;border-collapse:collapse;font-size:13px}
.items-table th{text-align:left;font-size:11px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
.items-table td{padding:9px 0;border-bottom:1px solid var(--line)}
.items-table td:last-child,.items-table th:last-child{text-align:right}
.totals-box{margin-top:14px;background:var(--paper);border-radius:12px;padding:14px 16px;font-size:13.5px}
.totals-box .row{display:flex;justify-content:space-between;padding:4px 0}
.totals-box .row.grand{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-weight:700;
  font-size:16px;color:var(--terra-deep);font-family:'Shippori Mincho',serif}

@media(max-width:820px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .orders-table thead{display:none}
  .orders-table,.orders-table tbody,.orders-table tr,.orders-table td{display:block;width:100%}
  .orders-table tbody tr{padding:12px 16px;border-top:1px solid var(--line)}
  .orders-table td{padding:3px 0;white-space:normal}
  .orders-table td::before{content:attr(data-label);display:inline-block;min-width:76px;font-size:11px;color:var(--muted)}
}
@media(max-width:520px){.stat-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ===== ログイン画面 ===== -->
<div id="loginView">
  <div class="login-card">
    <div class="login-mark">峯商店</div>
    <div class="login-sub">CURRY &amp; CAFÉ</div>
    <div class="login-title">注文管理システム</div>
    <form class="login-form" id="loginForm" novalidate>
      <label for="loginPassword">パスワード</label>
      <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••">
      <button type="submit" class="login-btn" id="loginBtn">ログイン</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- ===== ダッシュボード ===== -->
<div id="dashboardView">
  <header class="adm-header">
    <div class="adm-wrap adm-header-inner">
      <div class="adm-brand">
        <span class="mark">峯商店</span>
        <span class="tag">ORDER MANAGEMENT</span>
      </div>
      <button class="logout-btn" id="logoutBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        ログアウト
      </button>
    </div>
  </header>

  <main class="adm-main">
    <!-- 統計カード -->
    <div class="stat-grid" id="statGrid">
      <div class="stat-card">
        <div class="stat-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div>
        <div class="stat-label">総売上</div>
        <div class="stat-value" id="statRevenue">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
        <div class="stat-label">総注文数</div>
        <div class="stat-value" id="statOrders">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div class="stat-label">本日の注文</div>
        <div class="stat-value" id="statToday">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
        <div class="stat-label">一番人気</div>
        <div class="stat-value" id="statTop">—</div>
      </div>
    </div>

    <!-- フィルター -->
    <div class="filter-bar">
      <div class="f-field f-q">
        <label for="fQ">検索</label>
        <input type="text" id="fQ" placeholder="お名前・電話番号・注文IDで検索">
      </div>
      <div class="f-field">
        <label for="fFrom">開始日</label>
        <input type="date" id="fFrom">
      </div>
      <div class="f-field">
        <label for="fTo">終了日</label>
        <input type="date" id="fTo">
      </div>
      <div class="f-field">
        <label for="fPref">都道府県</label>
        <select id="fPref"><option value="">すべて</option></select>
      </div>
      <button class="f-btn" id="fSearchBtn">検索</button>
      <button class="f-reset" id="fResetBtn" type="button">リセット</button>
    </div>

    <!-- 注文一覧 -->
    <div class="orders-panel">
      <div class="table-scroll">
        <table class="orders-table">
          <thead>
            <tr>
              <th>日時</th><th>お客様</th><th>電話番号</th><th>都道府県</th><th>金額</th><th>ステータス</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <tr><td colspan="6" class="table-loading">読み込み中…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <span class="pg-info" id="pgInfo">—</span>
        <div class="pg-btns">
          <button id="pgPrev">← 前へ</button>
          <button id="pgNext">次へ →</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ===== 注文詳細モーダル ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard">
    <div class="modal-head">
      <span class="modal-head-title">注文詳細</span>
      <button class="modal-close" id="modalClose" aria-label="閉じる">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var REGION_LABELS = {
    hokkaido:'北海道', tohoku_n:'北東北', tohoku_s:'南東北', kanto:'関東',
    niigata_nagano:'信越', hokuriku:'北陸', tokai:'東海', kinki:'関西',
    chugoku:'中国', shikoku:'四国', kyushu:'九州', okinawa:'沖縄'
  };
  var STATUS_LABELS = { captured:['支払い完了','captured'], authorized:['承認済み','authorized'] };

  function yen(n){ return '¥' + Number(n || 0).toLocaleString('ja-JP'); }
  function regionLabel(key){ return REGION_LABELS[key] || key || '—'; }

  // SQLite の datetime('now') は "YYYY-MM-DD HH:MM:SS"（UTC）形式で返るため、
  // ISO形式に変換してからブラウザのローカル（日本時間想定）表示に変換する
  function fmtDate(raw){
    if(!raw) return '—';
    var iso = raw.indexOf('T') === -1 ? raw.replace(' ', 'T') + 'Z' : raw;
    var d = new Date(iso);
    if(isNaN(d.getTime())) return raw;
    return d.toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  }

  function statusBadge(status){
    var meta = STATUS_LABELS[status];
    if(!meta) return '<span class="badge other">' + (status || '—') + '</span>';
    return '<span class="badge ' + meta[1] + '">' + meta[0] + '</span>';
  }

  // 都道府県フィルターの選択肢を組み立て
  var fPrefEl = document.getElementById('fPref');
  Object.keys(REGION_LABELS).forEach(function(key){
    var opt = document.createElement('option');
    opt.value = key; opt.textContent = REGION_LABELS[key];
    fPrefEl.appendChild(opt);
  });

  // ===== ログイン =====
  var loginView = document.getElementById('loginView');
  var dashboardView = document.getElementById('dashboardView');
  var loginForm = document.getElementById('loginForm');
  var loginPassword = document.getElementById('loginPassword');
  var loginBtn = document.getElementById('loginBtn');
  var loginErr = document.getElementById('loginErr');

  function showDashboard(){
    loginView.style.display = 'none';
    dashboardView.style.display = 'block';
    loadStats();
    loadOrders();
  }
  function showLogin(){
    dashboardView.style.display = 'none';
    loginView.style.display = 'flex';
    loginPassword.focus();
  }

  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    var password = loginPassword.value;
    if(!password){ loginErr.textContent = 'パスワードを入力してください。'; return; }
    loginBtn.disabled = true;
    loginErr.textContent = '';
    fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    })
      .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(result){
        loginBtn.disabled = false;
        if(!result.ok){ loginErr.textContent = result.data.error || 'ログインに失敗しました。'; return; }
        loginPassword.value = '';
        showDashboard();
      })
      .catch(function(){
        loginBtn.disabled = false;
        loginErr.textContent = '通信エラーが発生しました。時間をおいて再度お試しください。';
      });
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    fetch('/api/admin/logout', { method: 'POST' }).finally(showLogin);
  });

  // ページ読み込み時、既に有効なセッションがあるか確認（毎回パスワード入力を省く）
  fetch('/api/admin/stats').then(function(res){
    if(res.status === 401){ showLogin(); return; }
    showDashboard();
  }).catch(showLogin);

  // ===== 統計 =====
  function loadStats(){
    fetch('/api/admin/stats').then(function(res){
      if(res.status === 401){ showLogin(); return null; }
      return res.json();
    }).then(function(d){
      if(!d) return;
      document.getElementById('statRevenue').textContent = yen(d.totalRevenue);
      document.getElementById('statOrders').innerHTML = d.orderCount.toLocaleString('ja-JP') + '<small> 件</small>';
      document.getElementById('statToday').innerHTML = d.todayCount.toLocaleString('ja-JP') + '<small> 件 (' + yen(d.todayRevenue) + ')</small>';
      document.getElementById('statTop').textContent = d.topProduct ? d.topProduct.name : '—';
    }).catch(function(){});
  }

  // ===== 注文一覧 + フィルター + ページング =====
  var PAGE_SIZE = 20;
  var state = { offset: 0, total: 0 };
  var ordersBody = document.getElementById('ordersBody');
  var pgInfo = document.getElementById('pgInfo');
  var pgPrev = document.getElementById('pgPrev');
  var pgNext = document.getElementById('pgNext');

  function currentFilters(){
    return {
      q: document.getElementById('fQ').value.trim(),
      from: document.getElementById('fFrom').value,
      to: document.getElementById('fTo').value,
      pref: fPrefEl.value
    };
  }

  function loadOrders(){
    var f = currentFilters();
    var params = new URLSearchParams();
    if(f.q) params.set('q', f.q);
    if(f.from) params.set('from', f.from);
    if(f.to) params.set('to', f.to);
    if(f.pref) params.set('pref', f.pref);
    params.set('limit', PAGE_SIZE);
    params.set('offset', state.offset);

    ordersBody.innerHTML = '<tr><td colspan="6" class="table-loading">読み込み中…</td></tr>';

    fetch('/api/admin/orders?' + params.toString()).then(function(res){
      if(res.status === 401){ showLogin(); return null; }
      return res.json();
    }).then(function(d){
      if(!d) return;
      state.total = d.total || 0;
      renderOrders(d.orders || []);
      renderPagination();
    }).catch(function(){
      ordersBody.innerHTML = '<tr><td colspan="6" class="table-empty">読み込みに失敗しました。</td></tr>';
    });
  }

  function renderOrders(orders){
    if(!orders.length){
      ordersBody.innerHTML = '<tr><td colspan="6" class="table-empty">該当する注文がありません。</td></tr>';
      return;
    }
    ordersBody.innerHTML = orders.map(function(o){
      return '<tr data-id="' + encodeURIComponent(o.id) + '">'
        + '<td data-label="日時">' + fmtDate(o.created_at) + '</td>'
        + '<td data-label="お客様" class="td-name">' + escapeHtml(o.customer_name || '—') + '</td>'
        + '<td data-label="電話番号">' + escapeHtml(o.customer_phone || '—') + '</td>'
        + '<td data-label="都道府県">' + regionLabel(o.customer_pref) + '</td>'
        + '<td data-label="金額" class="td-amount">' + yen(o.amount) + '</td>'
        + '<td data-label="ステータス">' + statusBadge(o.status) + '</td>'
        + '</tr>';
    }).join('');

    Array.prototype.forEach.call(ordersBody.querySelectorAll('tr[data-id]'), function(tr){
      tr.addEventListener('click', function(){ openOrder(decodeURIComponent(tr.getAttribute('data-id'))); });
    });
  }

  function renderPagination(){
    var shownFrom = state.total === 0 ? 0 : state.offset + 1;
    var shownTo = Math.min(state.offset + PAGE_SIZE, state.total);
    pgInfo.textContent = shownFrom + '–' + shownTo + ' / ' + state.total.toLocaleString('ja-JP') + '件';
    pgPrev.disabled = state.offset <= 0;
    pgNext.disabled = state.offset + PAGE_SIZE >= state.total;
  }

  pgPrev.addEventListener('click', function(){ state.offset = Math.max(0, state.offset - PAGE_SIZE); loadOrders(); });
  pgNext.addEventListener('click', function(){ state.offset += PAGE_SIZE; loadOrders(); });

  document.getElementById('fSearchBtn').addEventListener('click', function(){ state.offset = 0; loadOrders(); });
  document.getElementById('fQ').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ state.offset = 0; loadOrders(); } });
  document.getElementById('fResetBtn').addEventListener('click', function(){
    document.getElementById('fQ').value = '';
    document.getElementById('fFrom').value = '';
    document.getElementById('fTo').value = '';
    fPrefEl.value = '';
    state.offset = 0;
    loadOrders();
  });

  function escapeHtml(str){
    return String(str == null ? '—' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // ===== 注文詳細モーダル =====
  var modalOverlay = document.getElementById('modalOverlay');
  var modalBody = document.getElementById('modalBody');

  function openOrder(id){
    modalOverlay.classList.add('open');
    modalBody.innerHTML = '<div class="table-loading">読み込み中…</div>';

    fetch('/api/admin/orders/' + encodeURIComponent(id)).then(function(res){
      if(res.status === 401){ showLogin(); return null; }
      return res.json();
    }).then(function(d){
      if(!d) return;
      if(d.error){ modalBody.innerHTML = '<div class="table-empty">' + escapeHtml(d.error) + '</div>'; return; }
      renderOrderDetail(d.order, d.items);
    }).catch(function(){
      modalBody.innerHTML = '<div class="table-empty">読み込みに失敗しました。</div>';
    });
  }

  function renderOrderDetail(o, items){
    var itemsRows = items.map(function(it){
      return '<tr><td>' + escapeHtml(it.product_name) + '</td><td>' + it.quantity + '</td>'
        + '<td>' + yen(it.unit_price) + '</td><td>' + yen(it.unit_price * it.quantity) + '</td></tr>';
    }).join('');

    var addressFull = [o.customer_postal ? '〒' + o.customer_postal : '', regionLabel(o.customer_pref), o.customer_address].filter(Boolean).join(' ');

    modalBody.innerHTML =
      '<div class="mb-row">' + statusBadge(o.status) + '<span class="mb-id">ID: ' + escapeHtml(o.id) + '</span></div>'
      + '<div class="mb-row" style="margin-top:-10px"><span style="font-size:12.5px;color:var(--muted)">' + fmtDate(o.created_at) + '</span></div>'

      + '<div class="mb-section">'
      +   '<h4><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>お客様情報</h4>'
      +   '<dl class="cust-grid">'
      +     '<dt>お名前</dt><dd>' + escapeHtml(o.customer_name) + '</dd>'
      +     '<dt>電話番号</dt><dd><a href="tel:' + escapeHtml(o.customer_phone) + '" style="color:var(--teal-deep)">' + escapeHtml(o.customer_phone) + '</a></dd>'
      +     (o.customer_email ? '<dt>メール</dt><dd><a href="mailto:' + escapeHtml(o.customer_email) + '" style="color:var(--teal-deep)">' + escapeHtml(o.customer_email) + '</a></dd>' : '')
      +     '<dt>お届け先</dt><dd>' + escapeHtml(addressFull) + '</dd>'
      +   '</dl>'
      +   '<button class="copy-btn" id="copyAddrBtn" type="button">'
      +     '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
      +     '配送情報をコピー'
      +   '</button>'
      + '</div>'

      + '<div class="mb-section">'
      +   '<h4><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>商品明細</h4>'
      +   '<table class="items-table"><thead><tr><th>商品名</th><th>数量</th><th>単価</th><th>小計</th></tr></thead>'
      +   '<tbody>' + (itemsRows || '<tr><td colspan="4" style="color:var(--muted)">明細データなし</td></tr>') + '</tbody></table>'
      +   '<div class="totals-box">'
      +     '<div class="row"><span>商品小計</span><span>' + yen(o.subtotal) + '</span></div>'
      +     '<div class="row"><span>送料</span><span>' + yen(o.shipping_fee) + '</span></div>'
      +     '<div class="row grand"><span>合計</span><span>' + yen(o.amount) + '</span></div>'
      +   '</div>'
      + '</div>';

    document.getElementById('copyAddrBtn').addEventListener('click', function(){
      var text = o.customer_name + ' 様\n〒' + (o.customer_postal || '') + ' ' + (o.customer_address || '') + '\nTEL: ' + (o.customer_phone || '');
      var btn = this;
      navigator.clipboard.writeText(text).then(function(){
        btn.classList.add('copied');
        btn.textContent = 'コピーしました ✓';
        setTimeout(function(){ btn.classList.remove('copied'); btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>配送情報をコピー'; }, 1800);
      }).catch(function(){});
    });
  }

  document.getElementById('modalClose').addEventListener('click', function(){ modalOverlay.classList.remove('open'); });
  modalOverlay.addEventListener('click', function(e){ if(e.target === modalOverlay) modalOverlay.classList.remove('open'); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') modalOverlay.classList.remove('open'); });

})();
</script>
</body>
</html>
